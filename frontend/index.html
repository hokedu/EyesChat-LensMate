<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EyesChat-LensMate - AI 视觉对话助手</title>
<style>
:root{--bg:#0a0a0f;--s1:#14141f;--s2:#1e1e30;--b2:#2a2a40;--tx:#e8e8f0;--t2:#808098;--ac:#6c5ce7;--ac2:#a29bfe;--gr:#00cec9;--rd:#ff6b6b;--or:#fdcb6e;--r12:12px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
.h{padding:10px 20px;background:var(--s1);border-bottom:1px solid var(--b2);display:flex;align-items:center;justify-content:space-between;min-height:52px}
.h .lg{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.h .lg .dot{width:9px;height:9px;border-radius:50%;background:var(--gr);display:inline-block}
.h .lg .dot.off{background:var(--t2)}
.h-c{display:flex;gap:8px;align-items:center;font-size:12px}
.sb{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--s2);color:var(--t2);white-space:nowrap}
.st-btn{background:var(--ac);color:#fff;border:none;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.st-btn:hover{background:var(--ac2)}
.st-btn:disabled{opacity:.4;cursor:default}
.ma{flex:1;display:flex;overflow:hidden}
.vp{width:50%;min-width:340px;display:flex;flex-direction:column;border-right:1px solid var(--b2)}
.vc{flex:1;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.vc video{width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}
.vo{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;background:rgba(0,0,0,.65);padding:6px 14px;border-radius:24px;backdrop-filter:blur(8px);align-items:center}
.vo button{background:none;border:none;color:var(--tx);cursor:pointer;font-size:18px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s}
.vo button:hover{background:rgba(255,255,255,.08)}
.vo .mic-on{color:var(--gr)}.vo .mic-off{color:var(--rd)}
.vo .fps{font-size:10px;color:var(--t2)}
.fq{font-size:10px;color:var(--t2);display:flex;align-items:center;gap:5px}
.fq .d{width:5px;height:5px;border-radius:50%;display:inline-block}
.fq .d.high{background:var(--gr)}.fq .d.med{background:var(--or)}.fq .d.low{background:var(--rd)}
.cp{flex:1;min-width:340px;display:flex;flex-direction:column}
.ch{padding:10px 20px;border-bottom:1px solid var(--b2);display:flex;justify-content:space-between;font-size:12px;color:var(--t2)}
.cm{flex:1;overflow-y:auto;padding:14px 20px}
.msg{margin-bottom:14px;animation:fIn .25s ease}
@keyframes fIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg .r{font-size:10px;font-weight:600;margin-bottom:3px;letter-spacing:.3px}
.msg.u .r{color:var(--ac2)}.msg.a .r{color:var(--gr)}.msg.s .r{color:var(--or)}
.msg .c{font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.s .c{font-size:11.5px;color:var(--t2);font-style:italic}
.msg .c i{color:var(--t2);font-size:11px}
.ti{display:none;align-items:center;gap:5px;padding:6px 0;color:var(--t2);font-size:12px}
.ti.on{display:flex}
.td{width:5px;height:5px;border-radius:50%;background:var(--t2);animation:pl 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes pl{0%,100%{opacity:.3}50%{opacity:1}}
.cf{padding:10px 20px;border-top:1px solid var(--b2)}
.ib{display:flex;gap:8px;align-items:center;background:var(--s2);border-radius:var(--r12);padding:4px}
.ib input{flex:1;background:none;border:none;outline:none;color:var(--tx);padding:7px 10px;font-size:13px}
.ib input::placeholder{color:var(--t2)}
.ib .snd{background:var(--ac);border:none;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;transition:all .15s}
.ib .snd:hover{background:var(--ac2)}.ib .snd:disabled{opacity:.4;cursor:default}
.co{background:var(--s1);border-top:1px solid var(--b2);padding:6px 20px;display:flex;gap:18px;font-size:11px;align-items:center;flex-wrap:wrap}
.ci{display:flex;align-items:center;gap:5px}
.ci .l{color:var(--t2)}.ci .v{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.cb{flex:1;height:3px;background:var(--s2);border-radius:2px;overflow:hidden;max-width:160px}
.cf2{height:100%;border-radius:2px;transition:width .4s ease}
.pr{display:flex;align-items:center;gap:8px;padding:2px 10px;border-radius:12px;cursor:pointer;font-size:11px;transition:all .15s}
.pr:hover{background:var(--s2)}.pr.on{background:rgba(108,92,231,.15);color:var(--ac2)}.pr.off{color:var(--t2)}
.sm{font-size:10px;color:var(--t2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:768px){.ma{flex-direction:column}.vp{width:100%;min-width:auto;height:38vh;border-right:none;border-bottom:1px solid var(--b2)}.cp{min-width:auto}}
</style>
</head>
<body>

<div class="h">
<div class="lg"><span class="dot off" id="sDot"></span>EyesChat-LensMate</div>
<div class="h-c">
<span class="sb" id="sStat">未连接</span>
<button class="st-btn" id="cBtn" onclick="tc()">开始对话</button>
</div>
</div>

<div class="ma">
<div class="vp">
<div class="vc">
<video id="v" autoplay playsinline muted></video>
<div class="vo">
<button id="camB" onclick="tCam()" title="摄像头">📷</button>
<button id="micB" onclick="tMic()" title="麦克风">🎤</button>
<span class="fps" id="fps">- fps</span>
<div class="fq"><span class="d high" id="qD"></span><span id="qL">高</span></div>
</div>
</div>
</div>

<div class="cp">
<div class="ch"><span>对话记录</span><span id="tC">0 轮</span></div>
<div class="cm" id="ms">
<div class="msg s"><div class="r">系统</div><div class="c">欢迎使用 EyesChat-LensMate！点击「开始对话」连接，打开摄像头和麦克风即可与 AI 进行视觉对话。支持语音打断、隐私模式和实时成本展示。</div></div>
</div>
<div class="cf">
<div class="ti" id="ti"><span>AI 正在思考</span><div class="td"></div><div class="td"></div><div class="td"></div></div>
<div class="ib"><input type="text" id="inp" placeholder="输入文字消息或打开麦克风说话..." onkeydown="if(event.key==='Enter')snd();"><button class="snd" onclick="snd()" id="sndB" disabled>➤</button></div>
</div>
<div class="co">
<div class="ci"><span class="l">Token</span><span class="v" id="tE">0</span></div>
<div class="ci"><span class="l">费用</span><span class="v" id="cE">$0.0000</span></div>
<div class="ci" style="flex:1;max-width:260px"><span class="l">预算</span><div class="cb"><div class="cf2" id="bB" style="width:0%"></div></div><span class="v" id="bP">0%</span></div>
<div class="ci"><span class="l">帧</span><span class="v" id="fE">0</span></div>
<div class="pr off" id="prB" onclick="tPriv()">🔒 <span id="prL">隐私关</span></div>
<div class="sm" id="scE">—</div>
</div>
</div>
</div>

<script>
// === STATE ===
const S={ws:null,si:null,co:false,ca:false,mi:false,st:null,fi:null,tu:0,fc:0,tc:0,tn:0,bt:50000,pr:false,sp:false}
let U = (location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/ws/chat"
const $=x=>document.getElementById(x)
const v=$("v"),ms=$("ms"),ip=$("inp")
// Shorthand refs
const cB=$("cBtn"),sD=$("sDot"),sS=$("sStat"),ti=$("ti"),sB=$("sndB")
const tE=$("tE"),cE=$("cE"),bB=$("bB"),bP=$("bP"),fE=$("fE"),tC=$("tC"),fps=$("fps"),prB=$("prB"),prL=$("prL"),scE=$("scE")

function tc(){S.co?dc():cn()}

function cn(){
  if(S.ws&&S.ws.readyState===WebSocket.OPEN)return
  cB.textContent="连接中...";cB.disabled=true
  S.ws=new WebSocket(U)
  S.ws.onopen=()=>{
    S.co=true;cB.textContent="断开连接";cB.disabled=false;if(S.ca&&v.videoWidth)startFrames()
    sD.className="dot";sS.textContent="已连接";sB.disabled=false
    sys("已连接到 EyesChat-LensMate 服务。")
    gs()
  }
  S.ws.onmessage=e=>{try{hm(JSON.parse(e.data))}catch(ex){}}
  S.ws.onclose=()=>{
    S.co=false;S.ws=null;cB.textContent="开始对话";cB.disabled=false
    sD.className="dot off";sS.textContent="未连接";sB.disabled=true
    ti.classList.remove("on");sys("连接已断开。");if(S.fi){clearInterval(S.fi);S.fi=null}
  }
  S.ws.onerror=()=>{sys("⚠️ 连接失败");cB.textContent="重试连接";cB.disabled=false;S.co=false;sD.className="dot off";sS.textContent="连接失败"}
}

function dc(){
  if(S.ws)S.ws.close()
  S.co=false;cB.textContent="开始对话";sD.className="dot off";sS.textContent="未连接";sB.disabled=true
  if(S.fi){clearInterval(S.fi);S.fi=null}
}

function ws(m){if(S.ws&&S.ws.readyState===WebSocket.OPEN)S.ws.send(JSON.stringify(m))}

let cur=null,audioCtx=null,srcNode=null

function hm(m){
  switch(m.type){
    case"session_start":
      S.si=m.session_id;if(m.config)S.bt=m.config.token_budget||50000
      gs();break
    case"text":
      if(!cur){const d=document.createElement("div");d.className="msg a";d.innerHTML='<div class="r">EyesChat</div><div class="c"></div>';ms.appendChild(d);cur=d.querySelector(".c");ms.scrollTop=ms.scrollHeight}
      cur.textContent+=m.content;ms.scrollTop=ms.scrollHeight;break
    case"stream_start":ti.classList.add("on");break
    case"stream_end":ti.classList.remove("on");break
    case"meta":
      try{
        const mt=JSON.parse(m.content)
        S.tu+=mt.total_tokens||0;S.tc+=mt.estimated_cost_usd||0
        tE.textContent=S.tu;cE.textContent="$"+S.tc.toFixed(6)
        const p=Math.min(100,(S.tu/S.bt)*100);bB.style.width=p+"%";bP.textContent=Math.round(p)+"%"
        bB.style.background=p>80?"var(--rd)":p>50?"var(--or)":"var(--ac)"
        if(cur&&S.ws&&S.ws.readyState===WebSocket.OPEN)cur=null
      }catch(ex){}break
    case"tts_start":
      ti.classList.remove("on");S.sp=true;break
    case"tts_data":
      if(m.audio){playAudio(m.audio)}break
    case"tts_end":
      S.sp=false;gs();break
    case"interrupt_ack":
      stopAudio();stopBrowserSpeech();S.sp=false;break
    case"privacy_ack":
      S.pr=m.enabled;prB.className="pr "+(m.enabled?"on":"off");prL.textContent=m.enabled?"隐私开":"隐私关"
      sys(m.enabled?"🔒 隐私模式已开启，数据不保存。":"隐私模式已关闭。");break
    case"frame_ack":
      S.fc++;fE.textContent=S.fc;if(m.timestamp&&m.timestamp!==""&&m.timestamp!==scE.textContent)scE.textContent=m.timestamp;break
    case"status":
      S.tn=m.turns||0;tC.textContent=S.tn+" 轮";S.tu=m.token_usage||0;tE.textContent=S.tu
      fE.textContent=m.frame_count||0;S.pr=m.privacy_mode||false
      prB.className="pr "+(S.pr?"on":"off");prL.textContent=S.pr?"隐私开":"隐私关"
      if(m.scene_summary)scE.textContent=m.scene_summary
      const p2=Math.min(100,(S.tu/S.bt)*100);bB.style.width=p2+"%";bP.textContent=Math.round(p2)+"%";break
    case"budget_exhausted":sys("⚠️ "+m.message);ti.classList.remove("on");break
    case"error":sys("❌ "+m.content);ti.classList.remove("on");break
    case"pong":break
  }
}

// === AUDIO PLAYER ===
let audioQueue=[],isPlaying=false

function playAudio(b64){
  audioQueue.push(b64)
  if(!isPlaying)processAudio()
}

async function processAudio(){
  if(audioQueue.length===0){isPlaying=false;return}
  isPlaying=true;const b64=audioQueue.shift()
  try{
    const resp=await fetch("data:audio/mpeg;base64,"+b64)
    const blob=await resp.blob()
    const url=URL.createObjectURL(blob)
    const au=new Audio(url)
    S.sp=true
    await new Promise((res,rej)=>{
      au.onended=res;au.onerror=res
      audioCtx=au
      au.play().catch(()=>{})
    })
    URL.revokeObjectURL(url)
  }catch(e){}
  processAudio()
}

function stopAudio(){
  audioQueue=[]
  if(audioCtx&&typeof audioCtx.pause==="function"){audioCtx.pause();audioCtx=null}
  isPlaying=false
}

// === CAMERA ===
async function tCam(){S.ca?stopCam():await startCam()}
async function startCam(){
  try{
    S.st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480}},audio:true})
    v.srcObject=S.st;S.ca=true;$("camB").classList.add("active")
    if(S.co)startFrames()
  }catch(e){sys("⚠️ 摄像头错误: "+e.message)}
}
function stopCam(){
  if(S.st)S.st.getTracks().forEach(t=>t.stop())
  v.srcObject=null;S.ca=false;$("camB").classList.remove("active")
  if(S.fi){clearInterval(S.fi);S.fi=null}
}

// === FRAME CAPTURE ===
function startFrames(){
  if(S.fi)clearInterval(S.fi)
  let lastTime=0
  S.fi=setInterval(()=>{
    if(!S.co||!S.ca||!v.videoWidth)return
    const c=document.createElement("canvas");c.width=320;c.height=240
    const ctx=c.getContext("2d");ctx.drawImage(v,0,0,320,240)
    const b64=c.toDataURL("image/jpeg",0.6).split(",")[1]
    ws({type:"frame",base64:b64})
    const now=Date.now()
    fps.textContent=lastTime?Math.round(1000/(now-lastTime))+" fps":"- fps"
    lastTime=now
  },600)
}

// === MIC / VOICE ===
function tMic(){
  S.mi=!S.mi;const b=$("micB")
  if(S.mi){b.classList.add("mic-on");b.classList.remove("mic-off");startVoice()}
  else{b.classList.add("mic-off");b.classList.remove("mic-on");stopVoice()}
}
let rec=null,vt=null
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition
  if(!SR){sys("⚠️ 浏览器不支持语音识别，请使用 Chrome");return}
  rec=new SR();rec.lang="zh-CN";rec.continuous=true;rec.interimResults=true
  let fin=""
  rec.onresult=e=>{
    let tmp=""
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)fin+=e.results[i][0].transcript
      else tmp+=e.results[i][0].transcript
    }
    ip.placeholder=tmp?"🎤 "+tmp+"...":"输入文字消息或打开麦克风说话..."
    if(fin){
      // Interrupt AI if speaking
      if(S.sp&&S.ws&&S.ws.readyState===WebSocket.OPEN){ws({type:"interrupt"});stopAudio();stopBrowserSpeech()}
      ip.value=fin;clearTimeout(vt)
      vt=setTimeout(()=>{if(fin.trim())snd();fin=""},1200)
    }
  }
  rec.onerror=()=>{try{rec.start()}catch(ex){}}
  rec.onend=()=>{if(S.mi)try{rec.start()}catch(ex){}}
  try{rec.start()}catch(ex){}
}
function stopVoice(){if(rec){try{rec.stop()}catch(ex){}rec=null}}

// === CHAT ===
function sys(t){const d=document.createElement("div");d.className="msg s";d.innerHTML='<div class="r">系统</div><div class="c">'+t+'</div>';ms.appendChild(d);ms.scrollTop=ms.scrollHeight}
function snd(){
  const t=ip.value.trim();if(!t||!S.co)return
  // Interrupt AI if speaking
  if(S.sp&&S.ws&&S.ws.readyState===WebSocket.OPEN){ws({type:"interrupt"});stopAudio();stopBrowserSpeech()}
  const d=document.createElement("div");d.className="msg u";d.innerHTML='<div class="r">你</div><div class="c">'+t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</div>';ms.appendChild(d);ms.scrollTop=ms.scrollHeight
  ws({type:"transcript",text:t});ip.value="";ip.focus()
}
function gs(){ws({type:"get_status"})}
function tPriv(){ws({type:"set_privacy",enabled:!S.pr})}
</script>
</body>
</html>
